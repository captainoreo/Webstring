<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebString - Wii Menu Edition</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="wii-container" id="wiiContainer">
    
    <!-- Top Controls Bar (Reference IMG_0527) -->
    <div class="wii-top-controls">
      <div class="search-box-wrapper">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Search games..." oninput="filterGames()">
      </div>
      <button class="wii-pill-control" onclick="recommendGame()">
        <span>🎲 Recommend</span>
      </button>
      <button class="wii-pill-control hide-btn" onclick="toggleHideGames()">
        <span>🙈 Hide Games</span>
      </button>
    </div>

    <!-- Wii Channel Grid Area with Pagination Arrows -->
    <div class="wii-main-area">
      <button class="wii-arrow left-arrow" onclick="changePage(-1)">&#9664;</button>
      
      <div class="wii-channel-grid" id="channelGrid">
        <!-- Dynamically populated by script.js -->
      </div>
      
      <button class="wii-arrow right-arrow" onclick="changePage(1)">&#9654;</button>
    </div>

    <!-- Wii Bottom Bar (Reference IMG_0527) -->
    <div class="wii-bottom-bar">
      <button class="wii-circle-button left-btn" onclick="openThemeModal()" title="Themes & Customization">
        <span class="palette-icon">🎨</span>
      </button>
      
      <div class="wii-dots-indicator" id="dotsIndicator">
        <!-- Dynamically generated page dashes -->
      </div>

      <button class="wii-circle-button right-btn" onclick="openThemeModal()" title="Settings">
        <span class="gear-icon">⚙️</span>
      </button>
    </div>

    <!-- Theme / Settings Modal -->
    <div class="wii-modal-overlay" id="themeModal" style="display: none;">
      <div class="wii-modal-window theme-window">
        <div class="wii-modal-header">
          <span>Display Properties & Themes</span>
          <button class="wii-pill-btn" onclick="closeThemeModal()">Close</button>
        </div>
        <div class="wii-modal-body">
          <fieldset class="wii-fieldset">
            <legend>Select Theme / Mascot</legend>
            <div id="theme-list"></div>
          </fieldset>
        </div>
      </div>
    </div>

    <!-- Game Player Modal -->
    <div class="wii-modal-overlay" id="gamePlayerModal" style="display: none;">
      <div class="wii-modal-window player-window">
        <div class="wii-modal-header">
          <span id="gameTitle">Now Playing</span>
          <div class="wii-player-actions">
            <button class="wii-pill-btn" onclick="maximizeGame()">Maximize</button>
            <button class="wii-pill-btn close-action" onclick="closeGame()">Wii Menu</button>
          </div>
        </div>
        <div class="wii-modal-body player-body">
          <iframe id="gameFrame" src=""></iframe>
        </div>
      </div>
    </div>

    <!-- Theme Mascot Integration -->
    <img id="desktop-mascot" class="vocaloid-mascot" src="" alt="Theme Mascot">
  </div>

  <script src="script.js"></script>
</body>
</html>
