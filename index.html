<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webstring</title>
    <style>
        :root {
            --main-bg: #e8e8e8;
            --channel-bg: #f0f0f0;
            --accent-color: #5ce1e6;
            --bottom-bar-bg: #f5f5f5;
            --bottom-bar-gradient: linear-gradient(to bottom, #f5f5f5, #d0d0d0);
        }

        /* Force custom cursors globally */
        body, .screen { cursor: url('/cursor/Normal Select.cur'), auto !important; }
        .channel:not(.empty), .round-btn, .arrow, .dot, button, input { cursor: url('/cursor/Link Select.cur'), pointer !important; }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Arial', sans-serif; }
        
        body {
            height: 100vh;
            width: 100vw;
            background-color: var(--main-bg);
            overflow: hidden; 
        }

        /* --- Main App Styles --- */
        .screen {
            position: relative;
            width: 100%;
            height: 100%;
            background: var(--main-bg);
            background-image: repeating-linear-gradient(to bottom, transparent, transparent 2px, rgba(0,0,0,0.04) 2px, rgba(0,0,0,0.04) 4px);
            overflow: hidden;
        }

        /* --- Pagination Arrows --- */
        .arrow {
            position: absolute;
            top: 40%;
            transform: translateY(-50%);
            width: 0; 
            height: 0; 
            border-top: 3vw solid transparent;
            border-bottom: 3vw solid transparent;
            max-border-width: 30px; 
            z-index: 10;
            transition: transform 0.2s, filter 0.2s;
            filter: drop-shadow(0 0 5px var(--accent-color));
        }

        .arrow:hover { transform: translateY(-50%) scale(1.1); filter: drop-shadow(0 0 10px var(--accent-color)); }

        .arrow-left {
            left: 2%;
            border-right: 4vw solid var(--accent-color);
            display: none;
        }

        .arrow-right {
            right: 2%;
            border-left: 4vw solid var(--accent-color);
        }

        @media (min-width: 1000px) {
            .arrow-left { border-right: 40px solid var(--accent-color); border-top: 25px solid transparent; border-bottom: 25px solid transparent; }
            .arrow-right { border-left: 40px solid var(--accent-color); border-top: 25px solid transparent; border-bottom: 25px solid transparent; }
        }

        /* --- Channel Grid --- */
        .pages-container {
            position: relative;
            width: 100%;
            height: calc(100% - 120px); 
        }

        .grid {
            display: none;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 1.5%;
            padding: 3% 6%;
            height: 100%;
        }

        .grid.active {
            display: grid;
        }

        .channel {
            background: var(--channel-bg);
            border-radius: 15px;
            border: 2px solid rgba(0,0,0,0.1);
            box-shadow: inset 0 0 15px rgba(0,0,0,0.1), 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s;
            text-decoration: none; 
            color: #555;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .channel img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            border-radius: 13px;
        }

        .channel:hover { 
            transform: scale(1.05); 
            background: #fff;
            color: #000;
        }
        
        .channel.empty:hover {
            transform: none;
            background: var(--channel-bg);
        }

        /* --- Bottom Bar --- */
        .bottom-bar {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 120px;
            background: var(--bottom-bar-gradient);
            pointer-events: none;
        }

        .bottom-bar::before {
            content: '';
            position: absolute;
            top: -30px;
            left: -10%;
            width: 120%;
            height: 60px;
            background: var(--bottom-bar-bg);
            border-top: 3px solid var(--accent-color);
            border-radius: 50% 50% 0 0;
        }

        .footer-content {
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 0 5% 20px 5%;
            height: 100%;
            pointer-events: auto;
        }

        .round-btn {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #fff, #e0e0e0);
            border-radius: 50%;
            border: 3px solid var(--accent-color);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: #888;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1), inset 0 -3px 5px rgba(0,0,0,0.1);
            position: relative;
            text-decoration: none;
            font-size: 1.5rem;
            flex-shrink: 0;
        }

        /* --- Pagination Dots --- */
        .page-dots {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: rgba(0, 0, 0, 0.25);
            transition: all 0.2s ease;
            display: inline-block;
        }

        .dot:hover {
            transform: scale(1.3);
            background-color: var(--accent-color);
        }

        .dot.active {
            background-color: var(--accent-color);
            transform: scale(1.25);
            box-shadow: 0 0 6px var(--accent-color);
        }

        .time-date { text-align: center; color: #666; margin-bottom: 5px; }
        .time { font-family: 'Courier New', monospace; font-size: 2.5rem; letter-spacing: 5px; }
        .am { font-family: 'Arial', sans-serif; font-size: 1.2rem; letter-spacing: 0; }
        .date { font-size: 1.5rem; font-weight: bold; margin-top: -5px; }

        /* --- Menus (Theme & Music Player) --- */
        .theme-menu {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 440px;
            max-width: 90%; 
            max-height: 90vh; 
            overflow-y: auto; 
            background: linear-gradient(to bottom, #ffffff, #e6e6e6);
            padding: 25px;
            border-radius: 15px;
            border: 3px solid var(--accent-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            z-index: 100;
            text-align: center;
        }

        .theme-menu.active {
            display: block;
        }

        .theme-menu h3 { color: #333; margin-bottom: 15px; font-size: 1.5rem; }
        .theme-menu h4 { color: #666; margin: 12px 0 8px 0; border-bottom: 1px solid #ccc; padding-bottom: 5px; }

        .menu-options { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 15px; }
        .theme-menu button { padding: 8px 12px; border: 1px solid #ccc; background: #f9f9f9; color: #333; border-radius: 5px; font-weight: bold; transition: all 0.2s; }
        .theme-menu button:hover { background: var(--accent-color); color: white; border-color: var(--accent-color); }

        .close-btn { background: #ff6b6b !important; color: white !important; border-color: #ee5252 !important; width: 100%; margin-top: 15px; font-size: 1.1rem; }

        /* --- Custom Music Player UI --- */
        .now-playing-card {
            background: #ffffff;
            border: 2px solid var(--accent-color);
            border-radius: 12px;
            padding: 15px;
            margin: 10px 0;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.03), 0 4px 10px rgba(0,0,0,0.05);
        }

        .track-info {
            font-size: 1rem;
            font-weight: bold;
            color: #444;
            margin-bottom: 12px;
            word-break: break-word;
        }

        .audio-controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }

        audio {
            width: 100%;
            height: 40px;
            outline: none;
            border-radius: 20px;
        }

        /* --- Theme Classes --- */
        body.theme-dark { background-color: #111; }
        body.theme-dark .screen { 
            background: var(--main-bg); 
            background-image: repeating-linear-gradient(to bottom, transparent, transparent 2px, rgba(255,255,255,0.04) 2px, rgba(255,255,255,0.04) 4px);
        }
        body.theme-dark .time-date, body.theme-dark .time-date .time, body.theme-dark .time-date .am, body.theme-dark .time-date .date { color: #ddd; }
        body.theme-dark .round-btn { background: linear-gradient(135deg, #555, #333); color: #fff; }
        body.theme-dark .dot { background-color: rgba(255, 255, 255, 0.3); }
        body.theme-dark .dot.active { background-color: var(--accent-color); }
    </style>
</head>

    <script>
        // --- Live Clock Functionality ---
        function updateClock() {
            const now = new Date();
            
            let hours = now.getHours();
            let minutes = now.getMinutes();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            
            hours = hours % 12;
            hours = hours ? hours : 12; 
            minutes = minutes < 10 ? '0' + minutes : minutes;
            
            const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            const dayName = days[now.getDay()];
            const month = now.getMonth() + 1; 
            const date = now.getDate();
            
            document.getElementById('clock-time').innerHTML = `${hours} ${minutes} <span class="am">${ampm}</span>`;
            document.getElementById('clock-date').innerText = `${dayName} ${month}/${date}`;
        }

        updateClock();
        setInterval(updateClock, 1000);

        // --- Page Logic ---
        let currentPage = 0;
        const totalPages = 4;

        function renderDots() {
            const dotsContainer = document.getElementById('page-dots');
            dotsContainer.innerHTML = '';
            
            for (let i = 0; i < totalPages; i++) {
                const dot = document.createElement('span');
                dot.className = `dot ${i === currentPage ? 'active' : ''}`;
                dot.onclick = () => goToPage(i);
                dotsContainer.appendChild(dot);
            }
        }

        function updatePaginationUI() {
            // Update active grid page
            document.querySelectorAll('.pages-container .grid').forEach((grid, idx) => {
                grid.classList.toggle('active', idx === currentPage);
            });

            // Update arrow visibility
            document.getElementById('prev-btn').style.display = currentPage === 0 ? 'none' : 'block';
            document.getElementById('next-btn').style.display = currentPage === totalPages - 1 ? 'none' : 'block';

            // Update dots state
            document.querySelectorAll('.page-dots .dot').forEach((dot, idx) => {
                dot.classList.toggle('active', idx === currentPage);
            });
        }

        function changePage(direction) {
            const newPage = currentPage + direction;
            if (newPage >= 0 && newPage < totalPages) {
                currentPage = newPage;
                updatePaginationUI();
            }
        }

        function goToPage(pageIndex) {
            if (pageIndex >= 0 && pageIndex < totalPages) {
                currentPage = pageIndex;
                updatePaginationUI();
            }
        }

        // Toggle Theme Menu Visibility
        function toggleThemeMenu() {
            const menu = document.getElementById('theme-menu');
            menu.classList.toggle('active');
            document.getElementById('music-menu').classList.remove('active');
        }

        // Toggle Music Menu Visibility
        function toggleMusicMenu() {
            const menu = document.getElementById('music-menu');
            menu.classList.toggle('active');
            document.getElementById('theme-menu').classList.remove('active');
        }

        // Audio Player Logic
        function loadCustomTrack() {
            const url = document.getElementById('custom-audio-url').value.trim();
            if (!url) return;

            const player = document.getElementById('main-audio-player');
            const title = document.getElementById('now-playing-title');
            
            player.src = url;
            player.load();
            player.play().catch(e => console.log('Autoplay prevented:', e));

            const fileName = url.split('/').pop().split('?')[0];
            title.innerText = fileName || 'Custom Audio Track';
            localStorage.setItem('savedAudioTrack', url);
        }

        function resetDefaultTrack() {
            const player = document.getElementById('main-audio-player');
            const title = document.getElementById('now-playing-title');
            const defaultPath = 'Music/2010 Toyota Corolla - 2003 Toyota Corolla.mp3';

            player.src = defaultPath;
            player.load();
            player.play().catch(e => console.log('Autoplay prevented:', e));
            
            title.innerText = '2010 Toyota Corolla - 2003 Toyota Corolla';
            localStorage.removeItem('savedAudioTrack');
        }

        // --- Theme Presets Database ---
        const themes = {
            'default': { bg: '#e8e8e8', channel: '#f0f0f0', accent: '#5ce1e6', barBg: '#f5f5f5', barGrad: 'linear-gradient(to bottom, #f5f5f5, #d0d0d0)', dark: false },
            'dark': { bg: '#2a2a2a', channel: '#444444', accent: '#5ce1e6', barBg: '#333333', barGrad: 'linear-gradient(to bottom, #333333, #1a1a1a)', dark: true },
            'neon': { bg: '#0f0c1b', channel: '#1d1838', accent: '#ff007f', barBg: '#130f26', barGrad: 'linear-gradient(to bottom, #130f26, #080612)', dark: true },
            'sage': { bg: '#e8f0e6', channel: '#f2f7f0', accent: '#78ab78', barBg: '#dce8d8', barGrad: 'linear-gradient(to bottom, #dce8d8, #b8ceb4)', dark: false },
            'sunset': { bg: '#fdeed9', channel: '#fff7ed', accent: '#ff7e5f', barBg: '#fbdcb9', barGrad: 'linear-gradient(to bottom, #fbdcb9, #f7c393)', dark: false },
            'ocean': { bg: '#e0f2fe', channel: '#f0f9ff', accent: '#0284c7', barBg: '#bae6fd', barGrad: 'linear-gradient(to bottom, #bae6fd, #7dd3fc)', dark: false },
            'midnight': { bg: '#18181b', channel: '#27272a', accent: '#eab308', barBg: '#1c1917', barGrad: 'linear-gradient(to bottom, #1c1917, #0c0a09)', dark: true },
            'berry': { bg: '#fce7f3', channel: '#fdf2f8', accent: '#ec4899', barBg: '#fbcfe8', barGrad: 'linear-gradient(to bottom, #fbcfe8, #f472b6)', dark: false }
        };

        // Handle Preset Theme Switching
        function setTheme(themeName) {
            const t = themes[themeName] || themes['default'];
            
            document.documentElement.style.setProperty('--main-bg', t.bg);
            document.documentElement.style.setProperty('--channel-bg', t.channel);
            document.documentElement.style.setProperty('--accent-color', t.accent);
            document.documentElement.style.setProperty('--bottom-bar-bg', t.barBg);
            document.documentElement.style.setProperty('--bottom-bar-gradient', t.barGrad);
            
            if (t.dark) {
                document.body.classList.add('theme-dark');
            } else {
                document.body.classList.remove('theme-dark');
            }
            
            localStorage.setItem('selectedTheme', themeName);
        }

        // Apply Tab Cloaking
        function applyCloak() {
            const title = document.getElementById('cloak-title').value;
            const iconUrl = document.getElementById('cloak-icon').value;
            
            if (title) document.title = title;
            
            if (iconUrl) {
                let link = document.querySelector("link[rel~='icon']");
                if (!link) {
                    link = document.createElement('link');
                    link.rel = 'icon';
                    document.head.appendChild(link);
                }
                link.href = iconUrl;
            }
        }

        // Load Saved Data on Startup
        function loadSavedData() {
            renderDots();
            updatePaginationUI();

            const savedTheme = localStorage.getItem('selectedTheme');
            if (savedTheme) {
                setTheme(savedTheme);
            }

            const savedAudioTrack = localStorage.getItem('savedAudioTrack');
            if (savedAudioTrack) {
                document.getElementById('custom-audio-url').value = savedAudioTrack;
                loadCustomTrack();
            }
        }

        // Initialize saved settings
        loadSavedData();
    </script>
</body>
</html>
