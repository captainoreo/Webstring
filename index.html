<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webstring</title>
    <style>
        :root {
            --main-bg: #e8e8e8;
            --channel-bg: #f0f0f0;
            --accent-color: #5ce1e6;
            --bottom-bar-bg: #f5f5f5;
            --bottom-bar-gradient: linear-gradient(to bottom, #f5f5f5, #d0d0d0);
        }

        /* Force custom cursors globally */
        body, .screen { cursor: url('/cursor/Normal Select.cur'), auto !important; }
        .channel:not(.empty), .round-btn, .arrow, button, input { cursor: url('/cursor/Link Select.cur'), pointer !important; }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Arial', sans-serif; }
        
        body {
            height: 100vh;
            width: 100vw;
            background-color: var(--main-bg);
            overflow: hidden; 
        }

        /* --- Main App Styles --- */
        .screen {
            position: relative;
            width: 100%;
            height: 100%;
            background: var(--main-bg);
            background-image: repeating-linear-gradient(to bottom, transparent, transparent 2px, rgba(0,0,0,0.04) 2px, rgba(0,0,0,0.04) 4px);
            overflow: hidden;
        }

        /* --- Pagination Arrows --- */
        .arrow {
            position: absolute;
            top: 40%;
            transform: translateY(-50%);
            width: 0; 
            height: 0; 
            border-top: 3vw solid transparent;
            border-bottom: 3vw solid transparent;
            max-border-width: 30px; 
            z-index: 10;
            transition: transform 0.2s, filter 0.2s;
            filter: drop-shadow(0 0 5px var(--accent-color));
        }

        .arrow:hover { transform: translateY(-50%) scale(1.1); filter: drop-shadow(0 0 10px var(--accent-color)); }

        .arrow-left {
            left: 2%;
            border-right: 4vw solid var(--accent-color);
            display: none;
        }

        .arrow-right {
            right: 2%;
            border-left: 4vw solid var(--accent-color);
        }

        @media (min-width: 1000px) {
            .arrow-left { border-right: 40px solid var(--accent-color); border-top: 25px solid transparent; border-bottom: 25px solid transparent; }
            .arrow-right { border-left: 40px solid var(--accent-color); border-top: 25px solid transparent; border-bottom: 25px solid transparent; }
        }

        /* --- Channel Grid --- */
        .pages-container {
            position: relative;
            width: 100%;
            height: calc(100% - 120px); 
        }

        .grid {
            display: none;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 1.5%;
            padding: 3% 6%;
            height: 100%;
        }

        .grid.active {
            display: grid;
        }

        .channel {
            background: var(--channel-bg);
            border-radius: 15px;
            border: 2px solid rgba(0,0,0,0.1);
            box-shadow: inset 0 0 15px rgba(0,0,0,0.1), 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s;
            text-decoration: none; 
            color: #555;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .channel img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            border-radius: 13px;
        }

        .channel:hover { 
            transform: scale(1.05); 
            background: #fff;
            color: #000;
        }
        
        .channel.empty:hover {
            transform: none;
            background: var(--channel-bg);
        }

        /* --- Bottom Bar --- */
        .bottom-bar {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 120px;
            background: var(--bottom-bar-gradient);
            pointer-events: none;
        }

        .bottom-bar::before {
            content: '';
            position: absolute;
            top: -30px;
            left: -10%;
            width: 120%;
            height: 60px;
            background: var(--bottom-bar-bg);
            border-top: 3px solid var(--accent-color);
            border-radius: 50% 50% 0 0;
        }

        .footer-content {
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 0 5% 20px 5%;
            height: 100%;
            pointer-events: auto;
        }

        .round-btn {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #fff, #e0e0e0);
            border-radius: 50%;
            border: 3px solid var(--accent-color);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: #888;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1), inset 0 -3px 5px rgba(0,0,0,0.1);
            position: relative;
            text-decoration: none;
            font-size: 1.5rem;
            flex-shrink: 0;
        }

        .time-date { text-align: center; color: #666; margin-bottom: 5px; }
        .time { font-family: 'Courier New', monospace; font-size: 2.5rem; letter-spacing: 5px; }
        .am { font-family: 'Arial', sans-serif; font-size: 1.2rem; letter-spacing: 0; }
        .date { font-size: 1.5rem; font-weight: bold; margin-top: -5px; }

        /* --- Menus (Theme & Music) Styles --- */
        .theme-menu {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 420px;
            max-width: 90%; 
            max-height: 90vh; 
            overflow-y: auto; 
            background: linear-gradient(to bottom, #ffffff, #e6e6e6);
            padding: 25px;
            border-radius: 15px;
            border: 3px solid var(--accent-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            z-index: 100;
            text-align: center;
        }

        .theme-menu.active {
            display: block;
        }

        .theme-menu h3 { color: #333; margin-bottom: 15px; font-size: 1.5rem; }
        .theme-menu h4 { color: #666; margin: 10px 0 5px 0; border-bottom: 1px solid #ccc; padding-bottom: 5px; }

        .menu-options { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 15px; }
        .theme-menu button { padding: 8px 12px; border: 1px solid #ccc; background: #f9f9f9; color: #333; border-radius: 5px; font-weight: bold; transition: all 0.2s; }
        .theme-menu button:hover { background: var(--accent-color); color: white; border-color: var(--accent-color); }

        .close-btn { background: #ff6b6b !important; color: white !important; border-color: #ee5252 !important; width: 100%; margin-top: 10px; font-size: 1.1rem; }

        /* --- Iframe Player Container --- */
        .iframe-container {
            width: 100%;
            height: 220px;
            border-radius: 10px;
            overflow: hidden;
            background: #111;
            border: 2px solid #ccc;
            margin-top: 10px;
        }

        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* --- Theme Classes --- */
        body.theme-dark { background-color: #111; }
        body.theme-dark .screen { 
            background: #2a2a2a; 
            background-image: repeating-linear-gradient(to bottom, transparent, transparent 2px, rgba(255,255,255,0.04) 2px, rgba(255,255,255,0.04) 4px);
        }
        body.theme-dark .time-date, body.theme-dark .time-date .time, body.theme-dark .time-date .am, body.theme-dark .time-date .date { color: #ddd; }
        body.theme-dark .round-btn { background: linear-gradient(135deg, #555, #333); color: #fff; }
    </style>
</head>

    <!-- JavaScript -->
    <script>
        // --- Live Clock Functionality ---
        function updateClock() {
            const now = new Date();
            
            let hours = now.getHours();
            let minutes = now.getMinutes();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            
            hours = hours % 12;
            hours = hours ? hours : 12; 
            minutes = minutes < 10 ? '0' + minutes : minutes;
            
            const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            const dayName = days[now.getDay()];
            const month = now.getMonth() + 1; 
            const date = now.getDate();
            
            document.getElementById('clock-time').innerHTML = `${hours} ${minutes} <span class="am">${ampm}</span>`;
            document.getElementById('clock-date').innerText = `${dayName} ${month}/${date}`;
        }

        updateClock();
        setInterval(updateClock, 1000);

        // --- Page Logic ---
        let currentPage = 0;
        const totalPages = 4;

        function changePage(direction) {
            document.getElementById(`page-${currentPage}`).classList.remove('active');
            currentPage += direction;
            document.getElementById(`page-${currentPage}`).classList.add('active');
            
            if (currentPage === 0) {
                document.getElementById('prev-btn').style.display = 'none';
            } else {
                document.getElementById('prev-btn').style.display = 'block';
            }

            if (currentPage === totalPages - 1) {
                document.getElementById('next-btn').style.display = 'none';
            } else {
                document.getElementById('next-btn').style.display = 'block';
            }
        }

        // Toggle Theme Menu Visibility
        function toggleThemeMenu() {
            const menu = document.getElementById('theme-menu');
            menu.classList.toggle('active');
            document.getElementById('music-menu').classList.remove('active');
        }

        // Toggle Music Menu Visibility
        function toggleMusicMenu() {
            const menu = document.getElementById('music-menu');
            menu.classList.toggle('active');
            document.getElementById('theme-menu').classList.remove('active');
        }

        // Handle Preset Theme Switching
        function setTheme(themeName) {
            document.body.classList.remove('theme-dark');
            
            if (themeName === 'dark') {
                document.documentElement.style.setProperty('--main-bg', '#2a2a2a');
                document.documentElement.style.setProperty('--channel-bg', '#444444');
                document.documentElement.style.setProperty('--accent-color', '#5ce1e6');
                document.documentElement.style.setProperty('--bottom-bar-bg', '#333333');
                document.documentElement.style.setProperty('--bottom-bar-gradient', 'linear-gradient(to bottom, #333333, #1a1a1a)');
                document.body.classList.add('theme-dark');
            } else {
                // Classic Wii / Default
                document.documentElement.style.setProperty('--main-bg', '#e8e8e8');
                document.documentElement.style.setProperty('--channel-bg', '#f0f0f0');
                document.documentElement.style.setProperty('--accent-color', '#5ce1e6');
                document.documentElement.style.setProperty('--bottom-bar-bg', '#f5f5f5');
                document.documentElement.style.setProperty('--bottom-bar-gradient', 'linear-gradient(to bottom, #f5f5f5, #d0d0d0)');
            }
            
            localStorage.setItem('selectedTheme', themeName);
        }

        // Apply Custom Colors from Theme Maker
        function applyThemeMaker(save = true) {
            const bgColor = document.getElementById('custom-bg').value;
            const channelColor = document.getElementById('custom-channel').value;
            const accentColor = document.getElementById('custom-accent').value;
            const barColor = document.getElementById('custom-bar').value;

            document.documentElement.style.setProperty('--main-bg', bgColor);
            document.documentElement.style.setProperty('--channel-bg', channelColor);
            document.documentElement.style.setProperty('--accent-color', accentColor);
            document.documentElement.style.setProperty('--bottom-bar-bg', barColor);
            document.documentElement.style.setProperty('--bottom-bar-gradient', `linear-gradient(to bottom, ${barColor}, #111111)`);
            document.body.classList.remove('theme-dark'); 
            
            if (save) {
                localStorage.setItem('selectedTheme', 'custom');
                localStorage.setItem('customBg', bgColor);
                localStorage.setItem('customChannel', channelColor);
                localStorage.setItem('customAccent', accentColor);
                localStorage.setItem('customBar', barColor);
            }
        }

        // Apply Tab Cloaking
        function applyCloak() {
            const title = document.getElementById('cloak-title').value;
            const iconUrl = document.getElementById('cloak-icon').value;
            
            if (title) document.title = title;
            
            if (iconUrl) {
                let link = document.querySelector("link[rel~='icon']");
                if (!link) {
                    link = document.createElement('link');
                    link.rel = 'icon';
                    document.head.appendChild(link);
                }
                link.href = iconUrl;
            }
        }

        // Iframe Player Logic
        function loadIframe(save = true) {
            let input = document.getElementById('iframe-url').value.trim();
            if (!input) return;

            // Extract src from pasted <iframe> HTML tag if applicable
            const match = input.match(/src=["']([^"']+)["']/);
            const url = match ? match[1] : input;

            document.getElementById('music-iframe').src = url;

            if (save) {
                localStorage.setItem('savedIframeUrl', url);
            }
        }

        // Load Saved Data on Startup
        function loadSavedData() {
            const savedTheme = localStorage.getItem('selectedTheme');
            
            if (savedTheme === 'custom') {
                const savedBg = localStorage.getItem('customBg') || '#e8e8e8';
                const savedChannel = localStorage.getItem('customChannel') || '#f0f0f0';
                const savedAccent = localStorage.getItem('customAccent') || '#5ce1e6';
                const savedBar = localStorage.getItem('customBar') || '#f5f5f5';
                
                document.getElementById('custom-bg').value = savedBg;
                document.getElementById('custom-channel').value = savedChannel;
                document.getElementById('custom-accent').value = savedAccent;
                document.getElementById('custom-bar').value = savedBar;
                
                applyThemeMaker(false);
            } else if (savedTheme) {
                setTheme(savedTheme);
            }

            // Load saved iframe URL
            const savedIframeUrl = localStorage.getItem('savedIframeUrl');
            if (savedIframeUrl) {
                document.getElementById('iframe-url').value = savedIframeUrl;
                loadIframe(false);
            }
        }

        // Initialize saved settings
        loadSavedData();
    </script>
