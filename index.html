<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webstring</title>
    <style>
        :root {
            --main-bg: #e8e8e8;
            --channel-bg: #f0f0f0;
            --accent-color: #5ce1e6;
            --bottom-bar-bg: #f5f5f5;
            --bottom-bar-gradient: linear-gradient(to bottom, #f5f5f5, #d0d0d0);
        }

        /* Force custom cursors globally */
        body, .screen { cursor: url('/cursor/Normal Select.cur'), auto !important; }
        .channel:not(.empty), .round-btn, .arrow, .dot, button, input, select { cursor: url('/cursor/Link Select.cur'), pointer !important; }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Arial', sans-serif; }
        
        body {
            height: 100vh;
            width: 100vw;
            background-color: var(--main-bg);
            overflow: hidden; 
        }

        /* --- Main App Styles --- */
        .screen {
            position: relative;
            width: 100%;
            height: 100%;
            background: var(--main-bg);
            background-image: repeating-linear-gradient(to bottom, transparent, transparent 2px, rgba(0,0,0,0.04) 2px, rgba(0,0,0,0.04) 4px);
            overflow: hidden;
        }

        .pages-container, .arrow, .page-dots {
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .screen.games-hidden .pages-container,
        .screen.games-hidden .arrow,
        .screen.games-hidden .page-dots {
            opacity: 0 !important;
            visibility: hidden !important;
            pointer-events: none !important;
        }

        /* Stops animated GIFs & grid rendering when iframe player is open to eliminate lag */
        .screen.iframe-active .pages-container,
        .screen.iframe-active .arrow,
        .screen.iframe-active .page-dots,
        .screen.iframe-active .vocaloid-mascot {
            display: none !important;
        }

        /* --- Mascot Illustration --- */
        .vocaloid-mascot {
            position: absolute;
            bottom: -50px;
            right: 25px;
            max-height: 340px;
            max-width: 280px;
            z-index: 3;
            pointer-events: none;
            object-fit: contain;
            filter: drop-shadow(0 6px 15px rgba(0,0,0,0.25));
            transition: opacity 0.3s ease, transform 0.3s ease;
            display: none;
        }

        /* --- Top Bar --- */
        .top-bar {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        #game-search {
            padding: 8px 16px;
            border-radius: 20px;
            border: 2px solid var(--accent-color);
            outline: none;
            width: 220px;
            font-size: 0.9rem;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: all 0.2s ease;
        }

        #game-search:focus {
            width: 270px;
            background: #fff;
            box-shadow: 0 0 12px var(--accent-color);
        }

        .recommend-btn, .hide-game-btn {
            padding: 8px 16px;
            border-radius: 20px;
            border: 2px solid var(--accent-color);
            background: linear-gradient(135deg, #fff, #e0e0e0);
            color: #333;
            font-weight: bold;
            font-size: 0.85rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .recommend-btn:hover, .hide-game-btn:hover {
            transform: scale(1.05);
            background: var(--accent-color);
            color: #fff;
        }

        /* --- Dynamic Search Container --- */
        .search-results-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: 1fr;
            gap: 1.5%;
            padding: 5% 6% 3% 6%;
            height: calc(100% - 120px);
            overflow-y: auto;
        }

        /* --- Pagination Arrows --- */
        .arrow {
            position: absolute;
            top: 40%;
            transform: translateY(-50%);
            width: 0; 
            height: 0; 
            border-top: 3vw solid transparent;
            border-bottom: 3vw solid transparent;
            max-border-width: 30px; 
            z-index: 10;
            transition: transform 0.2s, filter 0.2s, opacity 0.3s ease;
            filter: drop-shadow(0 0 5px var(--accent-color));
        }

        .arrow:hover { transform: translateY(-50%) scale(1.1); filter: drop-shadow(0 0 10px var(--accent-color)); }

        .arrow-left {
            left: 2%;
            border-right: 4vw solid var(--accent-color);
            display: none;
        }

        .arrow-right {
            right: 2%;
            border-left: 4vw solid var(--accent-color);
        }

        @media (min-width: 1000px) {
            .arrow-left { border-right: 40px solid var(--accent-color); border-top: 25px solid transparent; border-bottom: 25px solid transparent; }
            .arrow-right { border-left: 40px solid var(--accent-color); border-top: 25px solid transparent; border-bottom: 25px solid transparent; }
        }

        /* --- Channel Grid --- */
        .pages-container {
            position: relative;
            width: 100%;
            height: calc(100% - 120px); 
            padding-top: 40px;
            z-index: 5;
        }

        .grid {
            display: none;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 1.5%;
            padding: 2% 6% 3% 6%;
            height: 100%;
        }

        .grid.active {
            display: grid;
        }

        .channel {
            background: var(--channel-bg);
            border-radius: 15px;
            border: 2px solid rgba(0,0,0,0.1);
            box-shadow: inset 0 0 15px rgba(0,0,0,0.1), 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            overflow: visible !important;
            transition: transform 0.2s;
            text-decoration: none; 
            color: #555;
            font-size: 0.85rem;
            font-weight: bold;
            min-height: 100px;
            z-index: 1;
        }

        .channel img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            border-radius: 13px;
        }

        .channel:hover { 
            transform: scale(1.05); 
            background: #fff;
            color: #000;
            z-index: 35 !important;
        }
        
        .channel.empty:hover {
            transform: none;
            background: var(--channel-bg);
        }

        /* --- Wii Style Speech Bubble --- */
        .speech-bubble {
            position: absolute;
            top: -24px;
            left: 50%;
            transform: translateX(-50%) translateY(6px) scale(0.9);
            background: #ffffff;
            color: #222222;
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            white-space: nowrap;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
            border: 2px solid #dcdcdc;
            pointer-events: none;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                        transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                        visibility 0.2s;
            z-index: 40;
        }

        /* Bubble Tail Border Shadow */
        .speech-bubble::before {
            content: '';
            position: absolute;
            bottom: -9px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 9px 8px 0 8px;
            border-style: solid;
            border-color: #dcdcdc transparent transparent transparent;
            display: block;
            width: 0;
        }

        /* Bubble Tail Fill */
        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -7px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 8px 7px 0 7px;
            border-style: solid;
            border-color: #ffffff transparent transparent transparent;
            display: block;
            width: 0;
        }

        .channel:not(.empty):hover .speech-bubble {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0) scale(1);
        }

        /* --- Bottom Bar --- */
        .bottom-bar {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 120px;
            background: var(--bottom-bar-gradient);
            pointer-events: none;
            z-index: 20;
        }

        .bottom-bar::before {
            content: '';
            position: absolute;
            top: -30px;
            left: -10%;
            width: 120%;
            height: 60px;
            background: var(--bottom-bar-bg);
            border-top: 3px solid var(--accent-color);
            border-radius: 50% 50% 0 0;
        }

        .footer-content {
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 0 5% 20px 5%;
            height: 100%;
            pointer-events: auto;
        }

        .round-btn {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #fff, #e0e0e0);
            border-radius: 50%;
            border: 3px solid var(--accent-color);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: #888;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1), inset 0 -3px 5px rgba(0,0,0,0.1);
            position: relative;
            text-decoration: none;
            font-size: 1.5rem;
            flex-shrink: 0;
        }

        /* --- Pagination Dots --- */
        .page-dots {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: rgba(0, 0, 0, 0.25);
            transition: all 0.2s ease;
            display: inline-block;
        }

        .dot:hover {
            transform: scale(1.3);
            background-color: var(--accent-color);
        }

        .dot.active {
            background-color: var(--accent-color);
            transform: scale(1.25);
            box-shadow: 0 0 6px var(--accent-color);
        }

        .time-date { text-align: center; color: #666; margin-bottom: 5px; }
        .time { font-family: 'Courier New', monospace; font-size: 2.5rem; letter-spacing: 5px; }
        .am { font-family: 'Arial', sans-serif; font-size: 1.2rem; letter-spacing: 0; }
        .date { font-size: 1.5rem; font-weight: bold; margin-top: -5px; }

        /* --- Menus & Modals --- */
        .theme-menu {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 480px;
            max-width: 90%; 
            max-height: 85vh; 
            overflow-y: auto; 
            background: linear-gradient(to bottom, #ffffff, #e6e6e6);
            padding: 25px;
            border-radius: 15px;
            border: 3px solid var(--accent-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            z-index: 100;
            text-align: center;
        }

        .theme-menu.active {
            display: block;
        }

        .theme-menu h3 { color: #333; margin-bottom: 15px; font-size: 1.5rem; }
        .theme-menu h4 { color: #666; margin: 12px 0 8px 0; border-bottom: 1px solid #ccc; padding-bottom: 5px; text-align: left; }

        .menu-options { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 10px; }
        .theme-menu button, .theme-menu select, .theme-menu input { 
            padding: 8px 12px; 
            border: 1px solid #ccc; 
            background: #f9f9f9; 
            color: #333; 
            border-radius: 5px; 
            font-weight: bold; 
            transition: all 0.2s; 
        }
        .theme-menu button:hover { background: var(--accent-color); color: white; border-color: var(--accent-color); }

        .close-btn { background: #ff6b6b !important; color: white !important; border-color: #ee5252 !important; width: 100%; margin-top: 15px; font-size: 1.1rem; }

        /* Form Inputs in Menu */
        .cloak-form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 10px;
            text-align: left;
            font-size: 0.85rem;
            color: #444;
        }

        .cloak-form-group input, .cloak-form-group select {
            width: 100%;
            box-sizing: border-box;
            font-size: 0.85rem;
        }

        .cloak-checkbox-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #ccc;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: #333;
        }

        .cloak-checkbox-group input[type="checkbox"] {
            width: auto;
            cursor: pointer;
        }

        /* Recommendation Modal Content */
        .recommendation-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-top: 15px;
        }

        .recommendation-card img {
            width: 160px;
            height: 160px;
            object-fit: cover;
            border-radius: 15px;
            border: 3px solid var(--accent-color);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .recommendation-card button.play-btn {
            display: inline-block;
            padding: 10px 24px;
            background: var(--accent-color);
            color: #fff;
            font-weight: bold;
            border: none;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: transform 0.2s;
            cursor: pointer;
        }

        .recommendation-card button.play-btn:hover {
            transform: scale(1.05);
        }

        /* --- Matching Theme Game Player Modal --- */
        .player-modal {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 200;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            backdrop-filter: blur(8px);
            background: rgba(0, 0, 0, 0.15);
            transition: opacity 0.3s ease;
        }

        .player-modal.active {
            display: flex;
        }

        .player-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            margin-bottom: 15px;
            border-radius: 25px;
            border: 2px solid var(--accent-color);
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            backdrop-filter: blur(5px);
            z-index: 201;
            flex-shrink: 0;
        }

        .player-title {
            font-weight: bold;
            font-size: 1.1rem;
            color: #333;
            display: flex;
            align-items: center;
            gap: 8px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .player-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .player-btn {
            padding: 8px 16px;
            border-radius: 20px;
            border: 2px solid var(--accent-color);
            background: linear-gradient(135deg, #fff, #e0e0e0);
            color: #333;
            font-weight: bold;
            font-size: 0.85rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: all 0.2s ease;
            white-space: nowrap;
            cursor: pointer;
        }

        .player-btn:hover {
            transform: scale(1.05);
            background: var(--accent-color);
            color: #fff;
        }

        .player-btn.close-btn-player {
            border-color: #ff6b6b;
            color: #ee5252;
        }

        .player-btn.close-btn-player:hover {
            background: #ff6b6b;
            color: #fff;
        }

        .player-iframe-wrapper {
            width: 100%;
            flex-grow: 1;
            background: var(--channel-bg);
            border-radius: 20px;
            border: 3px solid var(--accent-color);
            box-shadow: inset 0 0 15px rgba(0,0,0,0.1), 0 8px 25px rgba(0,0,0,0.15);
            overflow: hidden;
            position: relative;
            display: flex;
        }

        .player-iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }

        /* Dark Theme Player Adaptations */
        body.theme-dark .player-bar {
            background: rgba(35, 35, 35, 0.9);
        }
        body.theme-dark .player-title {
            color: #fff;
        }
        body.theme-dark .player-btn {
            background: linear-gradient(135deg, #555, #333);
            color: #fff;
        }
        body.theme-dark .player-btn:hover {
            background: var(--accent-color);
            color: #000;
        }
        body.theme-dark .player-btn.close-btn-player {
            color: #ff6b6b;
        }
        body.theme-dark .player-btn.close-btn-player:hover {
            background: #ff6b6b;
            color: #fff;
        }

        /* --- Theme Classes --- */
        body.theme-dark { background-color: #111; }
        body.theme-dark .screen { 
            background: var(--main-bg); 
            background-image: repeating-linear-gradient(to bottom, transparent, transparent 2px, rgba(255,255,255,0.04) 2px, rgba(255,255,255,0.04) 4px);
        }
        body.theme-dark .time-date, body.theme-dark .time-date .time, body.theme-dark .time-date .am, body.theme-dark .time-date .date { color: #ddd; }
        body.theme-dark .round-btn { background: linear-gradient(135deg, #555, #333); color: #fff; }
        body.theme-dark .dot { background-color: rgba(255, 255, 255, 0.3); }
        body.theme-dark .dot.active { background-color: var(--accent-color); }
    </style>
</head>

    <!-- JavaScript -->
    <script>
        // --- Live Clock Functionality ---
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            
            hours = hours % 12;
            hours = hours ? hours : 12; 
            minutes = minutes < 10 ? '0' + minutes : minutes;
            
            const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            const dayName = days[now.getDay()];
            const month = now.getMonth() + 1; 
            const date = now.getDate();
            
            document.getElementById('clock-time').innerHTML = `${hours} ${minutes} <span class="am">${ampm}</span>`;
            document.getElementById('clock-date').innerText = `${dayName} ${month}/${date}`;
        }

        updateClock();
        setInterval(updateClock, 1000);

        // --- Speech Bubble Functionality ---
        function initSpeechBubbles() {
            document.querySelectorAll('.channel:not(.empty)').forEach(ch => {
                if (!ch.querySelector('.speech-bubble')) {
                    const img = ch.querySelector('img');
                    const title = img ? img.alt : '';
                    if (title) {
                        const bubble = document.createElement('div');
                        bubble.className = 'speech-bubble';
                        bubble.textContent = title;
                        ch.appendChild(bubble);

                        // Custom glitch feature specifically for Time Fcuk
                        if (title === 'TIME FCUK') {
                            setInterval(() => {
                                const chars = ['F', 'C', 'U', 'K'];
                                let scrambledFcuk = 'Fcuk'.split('').map(char => {
                                    const randomChar = chars[Math.floor(Math.random() * chars.length)];
                                    return char === char.toUpperCase() ? randomChar.toUpperCase() : randomChar;
                                }).join('');
                                bubble.textContent = 'Time ' + scrambledFcuk;
                            }, 80); // Scrambles every 80 milliseconds
                        }
                    }
                }
            });
        }

        // --- Page Logic ---
        let currentPage = 0;
        const totalPages = 5;

        function renderDots() {
            const dotsContainer = document.getElementById('page-dots');
            dotsContainer.innerHTML = '';
            
            for (let i = 0; i < totalPages; i++) {
                const dot = document.createElement('span');
                dot.className = `dot ${i === currentPage ? 'active' : ''}`;
                dot.onclick = () => goToPage(i);
                dotsContainer.appendChild(dot);
            }
        }

        function updatePaginationUI() {
            document.querySelectorAll('.pages-container .grid').forEach((grid, idx) => {
                grid.classList.toggle('active', idx === currentPage);
            });

            document.getElementById('prev-btn').style.display = currentPage === 0 ? 'none' : 'block';
            document.getElementById('next-btn').style.display = currentPage === totalPages - 1 ? 'none' : 'block';

            document.querySelectorAll('.page-dots .dot').forEach((dot, idx) => {
                dot.classList.toggle('active', idx === currentPage);
            });
        }

        function changePage(direction) {
            const newPage = currentPage + direction;
            if (newPage >= 0 && newPage < totalPages) {
                currentPage = newPage;
                updatePaginationUI();
            }
        }

        function goToPage(pageIndex) {
            if (pageIndex >= 0 && pageIndex < totalPages) {
                currentPage = pageIndex;
                updatePaginationUI();
            }
        }

        // --- Search Bar Functionality ---
        function handleSearch() {
            const query = document.getElementById('game-search').value.toLowerCase().trim();
            const searchGrid = document.getElementById('search-results-grid');
            const pageGrids = document.querySelectorAll('.pages-container .grid');
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');
            const pageDots = document.getElementById('page-dots');

            if (query === '') {
                searchGrid.style.display = 'none';
                searchGrid.innerHTML = '';
                pageGrids.forEach((g, idx) => {
                    g.classList.toggle('active', idx === currentPage);
                });
                pageDots.style.display = 'flex';
                updatePaginationUI();
                return;
            }

            pageGrids.forEach(g => g.classList.remove('active'));
            prevBtn.style.display = 'none';
            nextBtn.style.display = 'none';
            pageDots.style.display = 'none';

            searchGrid.innerHTML = '';
            searchGrid.style.display = 'grid';

            const allChannels = document.querySelectorAll('.pages-container .channel:not(.empty)');
            let matchCount = 0;

            allChannels.forEach(ch => {
                const img = ch.querySelector('img');
                const title = img ? img.alt.toLowerCase() : '';
                if (title.includes(query)) {
                    const clone = ch.cloneNode(true);
                    searchGrid.appendChild(clone);
                    matchCount++;
                }
            });

            if (matchCount === 0) {
                searchGrid.innerHTML = '<div style="grid-column: 1 / -1; color: #777; font-size: 1.2rem; margin-top: 30px; text-align: center;">No games found.</div>';
            } else {
                initSpeechBubbles();
            }
        }

        // --- Toggle Hide Games Mode ---
        function toggleHideGameScreen() {
            const screen = document.querySelector('.screen');
            const btn = document.getElementById('hide-game-btn');
            
            screen.classList.toggle('games-hidden');

            if (screen.classList.contains('games-hidden')) {
                btn.innerHTML = '👁️ Show Games';
            } else {
                btn.innerHTML = '🙈 Hide Games';

        }

        // --- Game Recommendation Functionality ---
        function recommendGame() {
            const allChannels = Array.from(document.querySelectorAll('.pages-container .channel:not(.empty)'));
            if (allChannels.length === 0) return;

            const randomGame = allChannels[Math.floor(Math.random() * allChannels.length)];
            const img = randomGame.querySelector('img');
            const title = img ? img.alt : 'Random Game';
            const imgSrc = img ? img.src : '';
            const href = randomGame.getAttribute('href');

            const card = document.getElementById('recommendation-card');
            const escapedTitle = title.replace(/'/g, "\\'");
            card.innerHTML = `
                <img src="${imgSrc}" alt="${title}">
                <h4 style="font-size: 1.2rem; color: #333; border: none; text-align: center;">${title}</h4>
                <button class="play-btn" onclick="openGamePlayer('${href}', '${escapedTitle}'); toggleRecommendationModal();">Play Now</button>
            `;

            document.getElementById('recommendation-modal').classList.add('active');
            document.getElementById('theme-menu').classList.remove('active');
            document.getElementById('settings-menu').classList.remove('active');
        }

        function toggleRecommendationModal() {
            document.getElementById('recommendation-modal').classList.toggle('active');
        }

        function toggleThemeMenu() {
            const menu = document.getElementById('theme-menu');
            menu.classList.toggle('active');
            document.getElementById('settings-menu').classList.remove('active');
            document.getElementById('recommendation-modal').classList.remove('active');
        }

        function toggleSettingsMenu() {
            const menu = document.getElementById('settings-menu');
            menu.classList.toggle('active');
            document.getElementById('theme-menu').classList.remove('active');
            document.getElementById('recommendation-modal').classList.remove('active');
        }

        // --- Game Player Functions ---
        let timeFcukPlayerInterval; // Stores the interval so it can be cleared

        function openGamePlayer(url, title = 'Game Player') {
            const modal = document.getElementById('player-modal');
            const iframe = document.getElementById('game-iframe');
            const titleEl = document.getElementById('player-title-text');
            const screen = document.querySelector('.screen');

            iframe.src = url;
            
            // Clear any existing glitch interval
            if (timeFcukPlayerInterval) clearInterval(timeFcukPlayerInterval);

            if (titleEl) {
                if (title === 'TIME FCUK') {
                    timeFcukPlayerInterval = setInterval(() => {
                        const chars = ['F', 'C', 'U', 'K'];
                        let scrambledFcuk = 'FCUK'.split('').map(char => {
                            const randomChar = chars[Math.floor(Math.random() * chars.length)];
                            return char === char.toUpperCase() ? randomChar.toUpperCase() : randomChar;
                        }).join('');
                        titleEl.innerText = `🎮 TIME ${scrambledFcuk}`;
                    }, 80);
                } else {
                    titleEl.innerText = `🎮 ${title}`;
                }
            }
            
            modal.classList.add('active');
            
            // Hide games background elements to stop GIF animations and prevent lag
            if (screen) screen.classList.add('iframe-active');
        }

        function closeGamePlayer() {
            const modal = document.getElementById('player-modal');
            const iframe = document.getElementById('game-iframe');
            const screen = document.querySelector('.screen');

            // Stop the glitch interval when the player is closed to save memory
            if (timeFcukPlayerInterval) clearInterval(timeFcukPlayerInterval);

            iframe.src = '';
            modal.classList.remove('active');
            
            // Unhide games background elements
            if (screen) screen.classList.remove('iframe-active');

            if (document.fullscreenElement) {
                document.exitFullscreen().catch(() => {});
            }
        }

        function reloadGameIframe() {
            const iframe = document.getElementById('game-iframe');
            if (iframe.src) {
                iframe.src = iframe.src;
            }
        }

        function toggleIframeFullscreen() {
            const wrapper = document.getElementById('player-iframe-wrapper');
            if (!document.fullscreenElement) {
                if (wrapper.requestFullscreen) {
                    wrapper.requestFullscreen();
                } else if (wrapper.webkitRequestFullscreen) {
                    wrapper.webkitRequestFullscreen();
                } else if (wrapper.msRequestFullscreen) {
                    wrapper.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // Click Event Listener for Channel Tiles
        document.addEventListener('click', function (e) {
            const channel = e.target.closest('.channel:not(.empty)');
            if (channel && channel.hasAttribute('href')) {
                e.preventDefault();
                const img = channel.querySelector('img');
                const title = img ? img.alt : 'Game Player';
                openGamePlayer(channel.getAttribute('href'), title);
            }
        });

        // --- Theme Database ---

        function setTheme(themeName) {
            const t = themes[themeName] || themes['default'];
            
            document.documentElement.style.setProperty('--main-bg', t.bg);
            document.documentElement.style.setProperty('--channel-bg', t.channel);
            document.documentElement.style.setProperty('--accent-color', t.accent);
            document.documentElement.style.setProperty('--bottom-bar-bg', t.barBg);
            document.documentElement.style.setProperty('--bottom-bar-gradient', t.barGrad);
            
            const screen = document.querySelector('.screen');
            if (screen) {
                if (t.bgImg) {
                    screen.style.backgroundImage = `url('${t.bgImg}'), repeating-linear-gradient(to bottom, transparent, transparent 2px, rgba(0,0,0,0.04) 2px, rgba(0,0,0,0.04) 4px)`;
                    screen.style.backgroundSize = 'cover';
                    screen.style.backgroundPosition = 'center';
                } else {
                    screen.style.backgroundImage = 'repeating-linear-gradient(to bottom, transparent, transparent 2px, rgba(0,0,0,0.04) 2px, rgba(0,0,0,0.04) 4px)';
                    screen.style.backgroundSize = 'auto';
                    screen.style.backgroundPosition = 'initial';
                }
            }

            const mascot = document.getElementById('vocaloid-mascot');
            if (t.mascotImg) {
                mascot.src = t.mascotImg;
                mascot.style.display = 'block';
            } else {
                mascot.style.display = 'none';
                mascot.src = '';
            }

            if (t.dark) {
                document.body.classList.add('theme-dark');
            } else {
                document.body.classList.remove('theme-dark');
            }
            
            localStorage.setItem('selectedTheme', themeName);
        }

        // ==========================================
        // --- ADVANCED TAB CLOAKING SYSTEM ---
        // ==========================================
        
        const cloakPresets = {
            'drive': { title: 'Google Drive', icon: 'https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png' },
            'classroom': { title: 'Classes', icon: 'https://ssl.gstatic.com/classroom/favicon.png' },

            'canvas': { title: 'Dashboard', icon: 'https://du11hjcvx0uqb.cloudfront.net/dist/images/favicon-e10d657a73.ico' },
            'wikipedia': { title: 'Wikipedia, the free encyclopedia', icon: 'https://en.wikipedia.org/static/favicon/wikipedia.ico' },

        };

        let currentActiveTitle = document.title;
        let currentActiveIcon = '';
        let originalTitle = 'Webstring';

        // Helper function to update page title and favicon icon link tag
        function setTabIdentity(title, iconUrl) {
            if (title) {
                document.title = title;
                currentActiveTitle = title;
            }
            if (iconUrl !== undefined) {
                currentActiveIcon = iconUrl;
                let link = document.querySelector("link[rel*='icon']");
                if (!link) {
                    link = document.createElement('link');
                    link.rel = 'shortcut icon';
                    document.head.appendChild(link);
                }
                link.href = iconUrl || '';
            }
        }

        // 1. Preset Cloak Applier
        function applyPresetCloak(presetKey) {
            if (!presetKey) return;
            const preset = cloakPresets[presetKey];
            if (preset) {
                setTabIdentity(preset.title, preset.icon);
                document.getElementById('cloak-title').value = preset.title;
                document.getElementById('cloak-icon').value = preset.icon;
                
                localStorage.setItem('cloakTitle', preset.title);
                localStorage.setItem('cloakIcon', preset.icon);
            }
        }

        // 2. Custom Title & Icon Cloak
        function applyCustomCloak() {
            const title = document.getElementById('cloak-title').value;
            const iconUrl = document.getElementById('cloak-icon').value;
            setTabIdentity(title, iconUrl);

            localStorage.setItem('cloakTitle', title);
            localStorage.setItem('cloakIcon', iconUrl);
        }

        // 3. Panic Key Configuration
        let panicKeySetting = '';
        let panicUrlSetting = '';

        function savePanicSettings() {
            panicKeySetting = document.getElementById('panic-key').value.trim();
            panicUrlSetting = document.getElementById('panic-url').value.trim();

            localStorage.setItem('panicKey', panicKeySetting);
            localStorage.setItem('panicUrl', panicUrlSetting);
            alert('Panic Key settings saved!');
        }

        document.addEventListener('keydown', function (e) {
            if (!panicKeySetting) return;

            if (e.key.toLowerCase() === panicKeySetting.toLowerCase() || e.code.toLowerCase() === panicKeySetting.toLowerCase()) {
                let targetUrl = panicUrlSetting || 'https://www.google.com';
                if (!targetUrl.startsWith('http://') && !targetUrl.startsWith('https://')) {
                    targetUrl = 'https://' + targetUrl;
                }
                window.location.href = targetUrl;
            }
        });

        // 4. Auto-Cloak on Tab Unfocus (Blur Switcher)
        let isAutoBlurActive = false;

        function toggleAutoBlurCloak(enabled) {
            isAutoBlurActive = enabled;
            localStorage.setItem('autoBlurCloak', enabled);
        }

        window.addEventListener('blur', () => {
            if (isAutoBlurActive) {
                document.title = 'Google Drive';
                let link = document.querySelector("link[rel*='icon']");
                if (link) link.href = cloakPresets['drive'].icon;
            }
        });

        window.addEventListener('focus', () => {
            if (isAutoBlurActive) {
                document.title = currentActiveTitle;
                let link = document.querySelector("link[rel*='icon']");
                if (link) link.href = currentActiveIcon;
            }
        });

        // 5. Open in about:blank Container
        function openAboutBlank() {
            const newWindow = window.open('about:blank', '_blank');
            if (!newWindow) {
                alert('Pop-up blocked! Please allow pop-ups to launch in about:blank.');
                return;
            }

            const doc = newWindow.document;
            const iframe = doc.createElement('iframe');
            
            iframe.style.width = '100vw';
            iframe.style.height = '100vh';
            iframe.style.border = 'none';
            iframe.style.position = 'fixed';
            iframe.style.top = '0';
            iframe.style.left = '0';
            iframe.src = window.location.href;

            doc.body.style.margin = '0';
            doc.body.style.height = '100vh';
            doc.body.appendChild(iframe);

            window.location.replace('https://www.google.com');
        }

        // --- Load Saved Data ---
        function loadSavedData() {
            renderDots();
            updatePaginationUI();
            initSpeechBubbles();

            const savedTheme = localStorage.getItem('selectedTheme');
            if (savedTheme) {
                setTheme(savedTheme);
            }

            // Restore Cloak settings
            const savedTitle = localStorage.getItem('cloakTitle');
            const savedIcon = localStorage.getItem('cloakIcon');
            if (savedTitle) {
                document.getElementById('cloak-title').value = savedTitle;
                setTabIdentity(savedTitle, savedIcon || '');
            }
            if (savedIcon) {
                document.getElementById('cloak-icon').value = savedIcon;
            }

            // Restore Panic Key settings
            const savedPanicKey = localStorage.getItem('panicKey');
            const savedPanicUrl = localStorage.getItem('panicUrl');
            if (savedPanicKey) {
                panicKeySetting = savedPanicKey;
                document.getElementById('panic-key').value = savedPanicKey;
            }
            if (savedPanicUrl) {
                panicUrlSetting = savedPanicUrl;
                document.getElementById('panic-url').value = savedPanicUrl;
            }

            // Restore Auto-Blur Cloak setting
            const savedAutoBlur = localStorage.getItem('autoBlurCloak') === 'true';
            isAutoBlurActive = savedAutoBlur;
            document.getElementById('auto-blur-cloak').checked = savedAutoBlur;
        }

        loadSavedData();
    </script>
</body>
</html>
