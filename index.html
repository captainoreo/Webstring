    <style>
        :root {
            --main-bg: #e8e8e8;
            --channel-bg: #f0f0f0;
            --accent-color: #5ce1e6;
            --bottom-bar-bg: #f5f5f5;
            --bottom-bar-gradient: linear-gradient(to bottom, #f5f5f5, #d0d0d0);
        }

        /* Force custom cursors globally */
        body, .screen { cursor: url('/cursor/Normal Select.cur'), auto !important; }
        .channel:not(.empty), .round-btn, .arrow, .dot, button, input, select { cursor: url('/cursor/Link Select.cur'), pointer !important; }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Arial', sans-serif; }
        
        body {
            height: 100vh;
            width: 100vw;
            background-color: var(--main-bg);
            overflow: hidden; 
        }

        /* --- Main App Styles --- */
        .screen {
            position: relative;
            width: 100%;
            height: 100%;
            background: var(--main-bg);
            background-image: repeating-linear-gradient(to bottom, transparent, transparent 2px, rgba(0,0,0,0.04) 2px, rgba(0,0,0,0.04) 4px);
            overflow: hidden;
        }

        /* Fade transitions when hiding games to reveal the background theme */
        .pages-container, .arrow, .page-dots {
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .screen.games-hidden .pages-container,
        .screen.games-hidden .arrow,
        .screen.games-hidden .page-dots {
            opacity: 0 !important;
            visibility: hidden !important;
            pointer-events: none !important;
        }

        /* --- Vocaloid Mascot Illustration (Behind Games, Cut Off at Bottom Bar) --- */
        .vocaloid-mascot {
            position: absolute;
            bottom: -50px; /* Positioned lower so the bottom half is cut off by the bottom bar */
            right: 25px;
            max-height: 340px;
            max-width: 280px;
            z-index: 3; /* Behind pages-container (z-index: 5) and bottom-bar (z-index: 20) */
            pointer-events: none;
            object-fit: contain;
            filter: drop-shadow(0 6px 15px rgba(0,0,0,0.25));
            transition: opacity 0.3s ease, transform 0.3s ease;
            display: none;
        }

        /* --- Top Bar (Search, Recommendation & Hide Game) --- */
        .top-bar {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        #game-search {
            padding: 8px 16px;
            border-radius: 20px;
            border: 2px solid var(--accent-color);
            outline: none;
            width: 220px;
            font-size: 0.9rem;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: all 0.2s ease;
        }

        #game-search:focus {
            width: 270px;
            background: #fff;
            box-shadow: 0 0 12px var(--accent-color);
        }

        .recommend-btn, .hide-game-btn {
            padding: 8px 16px;
            border-radius: 20px;
            border: 2px solid var(--accent-color);
            background: linear-gradient(135deg, #fff, #e0e0e0);
            color: #333;
            font-weight: bold;
            font-size: 0.85rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .recommend-btn:hover, .hide-game-btn:hover {
            transform: scale(1.05);
            background: var(--accent-color);
            color: #fff;
        }

        /* --- Dynamic Search Container --- */
        .search-results-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: 1fr;
            gap: 1.5%;
            padding: 5% 6% 3% 6%;
            height: calc(100% - 120px);
            overflow-y: auto;
        }

        /* --- Pagination Arrows --- */
        .arrow {
            position: absolute;
            top: 40%;
            transform: translateY(-50%);
            width: 0; 
            height: 0; 
            border-top: 3vw solid transparent;
            border-bottom: 3vw solid transparent;
            max-border-width: 30px; 
            z-index: 10;
            transition: transform 0.2s, filter 0.2s, opacity 0.3s ease;
            filter: drop-shadow(0 0 5px var(--accent-color));
        }

        .arrow:hover { transform: translateY(-50%) scale(1.1); filter: drop-shadow(0 0 10px var(--accent-color)); }

        .arrow-left {
            left: 2%;
            border-right: 4vw solid var(--accent-color);
            display: none;
        }

        .arrow-right {
            right: 2%;
            border-left: 4vw solid var(--accent-color);
        }

        @media (min-width: 1000px) {
            .arrow-left { border-right: 40px solid var(--accent-color); border-top: 25px solid transparent; border-bottom: 25px solid transparent; }
            .arrow-right { border-left: 40px solid var(--accent-color); border-top: 25px solid transparent; border-bottom: 25px solid transparent; }
        }

        /* --- Channel Grid --- */
        .pages-container {
            position: relative;
            width: 100%;
            height: calc(100% - 120px); 
            padding-top: 40px;
            z-index: 5;
        }

        .grid {
            display: none;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 1.5%;
            padding: 2% 6% 3% 6%;
            height: 100%;
        }

        .grid.active {
            display: grid;
        }

        .channel {
            background: var(--channel-bg);
            border-radius: 15px;
            border: 2px solid rgba(0,0,0,0.1);
            box-shadow: inset 0 0 15px rgba(0,0,0,0.1), 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s;
            text-decoration: none; 
            color: #555;
            font-size: 0.85rem;
            font-weight: bold;
            min-height: 100px;
        }

        .channel img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            border-radius: 13px;
        }

        .channel:hover { 
            transform: scale(1.05); 
            background: #fff;
            color: #000;
        }
        
        .channel.empty:hover {
            transform: none;
            background: var(--channel-bg);
        }

        /* --- Bottom Bar --- */
        .bottom-bar {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 120px;
            background: var(--bottom-bar-gradient);
            pointer-events: none;
            z-index: 20;
        }

        .bottom-bar::before {
            content: '';
            position: absolute;
            top: -30px;
            left: -10%;
            width: 120%;
            height: 60px;
            background: var(--bottom-bar-bg);
            border-top: 3px solid var(--accent-color);
            border-radius: 50% 50% 0 0;
        }

        .footer-content {
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 0 5% 20px 5%;
            height: 100%;
            pointer-events: auto;
        }

        .round-btn {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #fff, #e0e0e0);
            border-radius: 50%;
            border: 3px solid var(--accent-color);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: #888;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1), inset 0 -3px 5px rgba(0,0,0,0.1);
            position: relative;
            text-decoration: none;
            font-size: 1.5rem;
            flex-shrink: 0;
        }

        /* --- Pagination Dots --- */
        .page-dots {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: rgba(0, 0, 0, 0.25);
            transition: all 0.2s ease;
            display: inline-block;
        }

        .dot:hover {
            transform: scale(1.3);
            background-color: var(--accent-color);
        }

        .dot.active {
            background-color: var(--accent-color);
            transform: scale(1.25);
            box-shadow: 0 0 6px var(--accent-color);
        }

        .time-date { text-align: center; color: #666; margin-bottom: 5px; }
        .time { font-family: 'Courier New', monospace; font-size: 2.5rem; letter-spacing: 5px; }
        .am { font-family: 'Arial', sans-serif; font-size: 1.2rem; letter-spacing: 0; }
        .date { font-size: 1.5rem; font-weight: bold; margin-top: -5px; }

        /* --- Menus & Modals --- */
        .theme-menu {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 460px;
            max-width: 90%; 
            max-height: 85vh; 
            overflow-y: auto; 
            background: linear-gradient(to bottom, #ffffff, #e6e6e6);
            padding: 25px;
            border-radius: 15px;
            border: 3px solid var(--accent-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            z-index: 100;
            text-align: center;
        }

        .theme-menu.active {
            display: block;
        }

        .theme-menu h3 { color: #333; margin-bottom: 15px; font-size: 1.5rem; }
        .theme-menu h4 { color: #666; margin: 12px 0 8px 0; border-bottom: 1px solid #ccc; padding-bottom: 5px; }

        .menu-options { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 15px; }
        .theme-menu button { padding: 8px 12px; border: 1px solid #ccc; background: #f9f9f9; color: #333; border-radius: 5px; font-weight: bold; transition: all 0.2s; }
        .theme-menu button:hover { background: var(--accent-color); color: white; border-color: var(--accent-color); }

        .close-btn { background: #ff6b6b !important; color: white !important; border-color: #ee5252 !important; width: 100%; margin-top: 15px; font-size: 1.1rem; }

        /* Recommendation Modal Content */
        .recommendation-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-top: 15px;
        }

        .recommendation-card img {
            width: 160px;
            height: 160px;
            object-fit: cover;
            border-radius: 15px;
            border: 3px solid var(--accent-color);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .recommendation-card a.play-btn {
            display: inline-block;
            padding: 10px 24px;
            background: var(--accent-color);
            color: #fff;
            font-weight: bold;
            text-decoration: none;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: transform 0.2s;
        }

        .recommendation-card a.play-btn:hover {
            transform: scale(1.05);
        }

        /* --- Theme Classes --- */
        body.theme-dark { background-color: #111; }
        body.theme-dark .screen { 
            background: var(--main-bg); 
            background-image: repeating-linear-gradient(to bottom, transparent, transparent 2px, rgba(255,255,255,0.04) 2px, rgba(255,255,255,0.04) 4px);
        }

        body.theme-dark .round-btn { background: linear-gradient(135deg, #555, #333); color: #fff; }
        body.theme-dark .dot { background-color: rgba(255, 255, 255, 0.3); }
        body.theme-dark .dot.active { background-color: var(--accent-color); }
    </style>
</head>

    <script>
        // --- Live Clock Functionality ---
        function updateClock() {
            const now = new Date();
            
            let hours = now.getHours();
            let minutes = now.getMinutes();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            
            hours = hours % 12;
            hours = hours ? hours : 12; 
            minutes = minutes < 10 ? '0' + minutes : minutes;
            
            const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            const dayName = days[now.getDay()];
            const month = now.getMonth() + 1; 
            const date = now.getDate();
            
            document.getElementById('clock-time').innerHTML = `${hours} ${minutes} <span class="am">${ampm}</span>`;
            document.getElementById('clock-date').innerText = `${dayName} ${month}/${date}`;
        }

        updateClock();
        setInterval(updateClock, 1000);

        // --- Page Logic ---
        let currentPage = 0;
        const totalPages = 4;

        function renderDots() {
            const dotsContainer = document.getElementById('page-dots');
            dotsContainer.innerHTML = '';
            
            for (let i = 0; i < totalPages; i++) {
                const dot = document.createElement('span');
                dot.className = `dot ${i === currentPage ? 'active' : ''}`;
                dot.onclick = () => goToPage(i);
                dotsContainer.appendChild(dot);
            }
        }

        function updatePaginationUI() {
            document.querySelectorAll('.pages-container .grid').forEach((grid, idx) => {
                grid.classList.toggle('active', idx === currentPage);
            });

            document.getElementById('prev-btn').style.display = currentPage === 0 ? 'none' : 'block';
            document.getElementById('next-btn').style.display = currentPage === totalPages - 1 ? 'none' : 'block';

            document.querySelectorAll('.page-dots .dot').forEach((dot, idx) => {
                dot.classList.toggle('active', idx === currentPage);
            });
        }

        function changePage(direction) {
            const newPage = currentPage + direction;
            if (newPage >= 0 && newPage < totalPages) {
                currentPage = newPage;
                updatePaginationUI();
            }
        }

        function goToPage(pageIndex) {
            if (pageIndex >= 0 && pageIndex < totalPages) {
                currentPage = pageIndex;
                updatePaginationUI();
            }
        }

        // --- Search Bar Functionality ---
        function handleSearch() {
            const query = document.getElementById('game-search').value.toLowerCase().trim();
            const searchGrid = document.getElementById('search-results-grid');
            const pageGrids = document.querySelectorAll('.pages-container .grid');
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');
            const pageDots = document.getElementById('page-dots');

            if (query === '') {
                searchGrid.style.display = 'none';
                searchGrid.innerHTML = '';
                pageGrids.forEach((g, idx) => {
                    g.classList.toggle('active', idx === currentPage);
                });
                pageDots.style.display = 'flex';
                updatePaginationUI();
                return;
            }

            pageGrids.forEach(g => g.classList.remove('active'));
            prevBtn.style.display = 'none';
            nextBtn.style.display = 'none';
            pageDots.style.display = 'none';

            searchGrid.innerHTML = '';
            searchGrid.style.display = 'grid';

            const allChannels = document.querySelectorAll('.pages-container .channel:not(.empty)');
            let matchCount = 0;

            allChannels.forEach(ch => {
                const img = ch.querySelector('img');
                const title = img ? img.alt.toLowerCase() : '';
                if (title.includes(query)) {
                    const clone = ch.cloneNode(true);
                    searchGrid.appendChild(clone);
                    matchCount++;
                }
            });

            if (matchCount === 0) {
                searchGrid.innerHTML = '<div style="grid-column: 1 / -1; color: #777; font-size: 1.2rem; margin-top: 30px; text-align: center;">No games found.</div>';
            }
        }

        // --- Toggle Hide Games Mode ---
        function toggleHideGameScreen() {
            const screen = document.querySelector('.screen');
            const btn = document.getElementById('hide-game-btn');
            
            screen.classList.toggle('games-hidden');

            if (screen.classList.contains('games-hidden')) {
                btn.innerHTML = '👁️ Show Games';
            } else {
                btn.innerHTML = '🙈 Hide Games';
            }
        }

        // --- Game Recommendation Functionality ---
        function recommendGame() {
            const allChannels = Array.from(document.querySelectorAll('.pages-container .channel:not(.empty)'));
            if (allChannels.length === 0) return;

            const randomGame = allChannels[Math.floor(Math.random() * allChannels.length)];
            const img = randomGame.querySelector('img');
            const title = img ? img.alt : 'Random Game';
            const imgSrc = img ? img.src : '';
            const href = randomGame.getAttribute('href');

            const card = document.getElementById('recommendation-card');
            card.innerHTML = `
                <img src="${imgSrc}" alt="${title}">
                <h4 style="font-size: 1.2rem; color: #333; border: none;">${title}</h4>
                <a href="${href}" class="play-btn">Play Now</a>
            `;

            document.getElementById('recommendation-modal').classList.add('active');
            document.getElementById('theme-menu').classList.remove('active');
            document.getElementById('settings-menu').classList.remove('active');
        }

        function toggleRecommendationModal() {
            document.getElementById('recommendation-modal').classList.toggle('active');
        }

        // Toggle Theme Menu Visibility
        function toggleThemeMenu() {
            const menu = document.getElementById('theme-menu');
            menu.classList.toggle('active');
            document.getElementById('settings-menu').classList.remove('active');
            document.getElementById('recommendation-modal').classList.remove('active');
        }

        // Toggle Settings Menu Visibility
        function toggleSettingsMenu() {
            const menu = document.getElementById('settings-menu');
            menu.classList.toggle('active');
            document.getElementById('theme-menu').classList.remove('active');
            document.getElementById('recommendation-modal').classList.remove('active');
        }

        // --- Extended Theme Presets Database ---
        const themes = {
            'default': { bg: '#e8e8e8', channel: '#f0f0f0', accent: '#5ce1e6', barBg: '#f5f5f5', barGrad: 'linear-gradient(to bottom, #f5f5f5, #d0d0d0)', dark: false },
            'dark': { bg: '#2a2a2a', channel: '#444444', accent: '#5ce1e6', barBg: '#333333', barGrad: 'linear-gradient(to bottom, #333333, #1a1a1a)', dark: true },
            'neon': { bg: '#0f0c1b', channel: '#1d1838', accent: '#ff007f', barBg: '#130f26', barGrad: 'linear-gradient(to bottom, #130f26, #080612)', dark: true },
            'sage': { bg: '#e8f0e6', channel: '#f2f7f0', accent: '#78ab78', barBg: '#dce8d8', barGrad: 'linear-gradient(to bottom, #dce8d8, #b8ceb4)', dark: false },
            'sunset': { bg: '#fdeed9', channel: '#fff7ed', accent: '#ff7e5f', barBg: '#fbdcb9', barGrad: 'linear-gradient(to bottom, #fbdcb9, #f7c393)', dark: false },
            'ocean': { bg: '#e0f2fe', channel: '#f0f9ff', accent: '#0284c7', barBg: '#bae6fd', barGrad: 'linear-gradient(to bottom, #bae6fd, #7dd3fc)', dark: false },
            'midnight': { bg: '#18181b', channel: '#27272a', accent: '#eab308', barBg: '#1c1917', barGrad: 'linear-gradient(to bottom, #1c1917, #0c0a09)', dark: true },
            'berry': { bg: '#fce7f3', channel: '#fdf2f8', accent: '#ec4899', barBg: '#fbcfe8', barGrad: 'linear-gradient(to bottom, #fbcfe8, #f472b6)', dark: false },
            'evil': { bg: '#1a0000', channel: '#330000', accent: '#ff1a1a', barBg: '#2b0000', barGrad: 'linear-gradient(to bottom, #2b0000, #100000)', dark: true },
            'kind': { bg: '#f0fdf4', channel: '#ffffff', accent: '#4ade80', barBg: '#dcfce7', barGrad: 'linear-gradient(to bottom, #dcfce7, #bbf7d0)', dark: false },
            'allred': { bg: '#7f1d1d', channel: '#991b1b', accent: '#f87171', barBg: '#881337', barGrad: 'linear-gradient(to bottom, #881337, #450a0a)', dark: true },
            'allblue': { bg: '#0c4a6e', channel: '#075985', accent: '#38bdf8', barBg: '#0369a1', barGrad: 'linear-gradient(to bottom, #0369a1, #082f49)', dark: true },
            
            // Vocaloid Themes with mascot artwork mapped to bottom right
            'miku': { bg: '#e0f7f6', channel: '#ffffff', accent: '#39c5bb', barBg: '#b2ece7', barGrad: 'linear-gradient(to bottom, #b2ece7, #80dfd7)', dark: false, mascotImg: '/assets/IMG_0155.png' },
            'teto': { bg: '#fde8ee', channel: '#ffffff', accent: '#e6005c', barBg: '#f9c2d1', barGrad: 'linear-gradient(to bottom, #f9c2d1, #f498b2)', dark: false, mascotImg: '/assets/IMG_0156.png' },
            'rin':  { bg: '#fffbe6', channel: '#ffffff', accent: '#ffb700', barBg: '#fff3b3', barGrad: 'linear-gradient(to bottom, #fff3b3, #ffe066)', dark: false, mascotImg: '/assets/IMG_0154.png' },
            'gumi': { bg: '#f0f9e8', channel: '#ffffff', accent: '#76c800', barBg: '#d9f2c2', barGrad: 'linear-gradient(to bottom, #d9f2c2, #b5e68d)', dark: false, mascotImg: '/assets/IMG_0158.webp' },
            
            // Custom Image Themes
            'img0121': { bg: '#1a1a24', bgImg: '/assets/IMG_0121.png', channel: 'rgba(255, 255, 255, 0.85)', accent: '#3b82f6', barBg: '#1e1e2d', barGrad: 'linear-gradient(to bottom, #1e1e2d, #11111b)', dark: true },
            'img0122': { bg: '#181825', bgImg: '/assets/IMG_0122.gif', channel: 'rgba(255, 255, 255, 0.85)', accent: '#cba6f7', barBg: '#1e1e2e', barGrad: 'linear-gradient(to bottom, #1e1e2e, #11111b)', dark: true }
        };

        // Handle Preset Theme Switching
        function setTheme(themeName) {
            const t = themes[themeName] || themes['default'];
            
            document.documentElement.style.setProperty('--main-bg', t.bg);
            document.documentElement.style.setProperty('--channel-bg', t.channel);
            document.documentElement.style.setProperty('--accent-color', t.accent);
            document.documentElement.style.setProperty('--bottom-bar-bg', t.barBg);
            document.documentElement.style.setProperty('--bottom-bar-gradient', t.barGrad);
            
            const screen = document.querySelector('.screen');
            if (screen) {
                if (t.bgImg) {
                    screen.style.backgroundImage = `url('${t.bgImg}'), repeating-linear-gradient(to bottom, transparent, transparent 2px, rgba(0,0,0,0.04) 2px, rgba(0,0,0,0.04) 4px)`;
                    screen.style.backgroundSize = 'cover';
                    screen.style.backgroundPosition = 'center';
                } else {
                    screen.style.backgroundImage = 'repeating-linear-gradient(to bottom, transparent, transparent 2px, rgba(0,0,0,0.04) 2px, rgba(0,0,0,0.04) 4px)';
                    screen.style.backgroundSize = 'auto';
                    screen.style.backgroundPosition = 'initial';
                }
            }

            // Update bottom-right Vocaloid mascot image
            const mascot = document.getElementById('vocaloid-mascot');
            if (t.mascotImg) {
                mascot.src = t.mascotImg;
                mascot.style.display = 'block';
            } else {
                mascot.style.display = 'none';
                mascot.src = '';
            }

            if (t.dark) {
                document.body.classList.add('theme-dark');
            } else {
                document.body.classList.remove('theme-dark');
            }
            
            localStorage.setItem('selectedTheme', themeName);
        }

        // Apply Tab Cloaking
        function applyCloak() {
            const title = document.getElementById('cloak-title').value;
            const iconUrl = document.getElementById('cloak-icon').value;
            
            if (title) document.title = title;
            
            if (iconUrl) {
                let link = document.querySelector("link[rel~='icon']");
                if (!link) {
                    link = document.createElement('link');
                    link.rel = 'icon';
                    document.head.appendChild(link);
                }
                link.href = iconUrl;
            }
        }

        // Load Saved Data on Startup
        function loadSavedData() {
            renderDots();
            updatePaginationUI();

            const savedTheme = localStorage.getItem('selectedTheme');
            if (savedTheme) {
                setTheme(savedTheme);
            }
        }

        // Initialize saved settings
        loadSavedData();
    </script>
</body>
</html>
