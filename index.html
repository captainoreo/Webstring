<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebString 98</title>
  
  <!-- External CSS Libraries and Files -->
  <link rel="stylesheet" href="https://unpkg.com/98.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Desktop Environment -->
  <div class="desktop" id="desktopArea">
    <div class="icon" ondblclick="openWindow('gamesWindow')">
      <img src="https://win98icons.alexmeub.com/icons/png/joystick-0.png" alt="Games">
      <br><span>Games</span>
    </div>
    
    <div class="icon" ondblclick="openWindow('themesWindow')">
      <img src="https://win98icons.alexmeub.com/icons/png/display_properties-1.png" alt="Themes">
      <br><span>Themes</span>
    </div>

    <!-- Restored Mascot Image -->
    <img id="desktop-mascot" class="vocaloid-mascot" src="" alt="Theme Mascot">
  </div>

  <!-- Games Explorer Window -->
  <div class="window" id="gamesWindow" style="left: 100px; top: 50px; width: 450px;">
    <div class="title-bar" id="gamesWindowHeader">
      <div class="title-bar-text">C:\Games Explorer</div>
      <div class="title-bar-controls">
        <button aria-label="Minimize" onclick="closeWindow('gamesWindow')"></button>
        <button aria-label="Maximize"></button>
        <button aria-label="Close" onclick="closeWindow('gamesWindow')"></button>
      </div>
    </div>
    <div class="window-body">
      <div class="game-grid">
        <div class="game-card" onclick="playGame('https://example.com/game1', 'Slope')">
          <img src="https://via.placeholder.com/100x100?text=Slope" alt="Slope">
          <p>Slope.exe</p>
        </div>
        <div class="game-card" onclick="playGame('https://example.com/game2', '1v1.lol')">
          <img src="https://via.placeholder.com/100x100?text=1v1" alt="1v1.lol">
          <p>1v1.exe</p>
        </div>
        <div class="game-card" onclick="playGame('https://example.com/game3', 'Retro Bowl')">
          <img src="https://via.placeholder.com/100x100?text=Retro" alt="Retro Bowl">
          <p>Retro.exe</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Legacy Themes Window -->
  <div class="window" id="themesWindow" style="left: 250px; top: 100px; width: 300px;">
    <div class="title-bar" id="themesWindowHeader">
      <div class="title-bar-text">Display Properties (Legacy)</div>
      <div class="title-bar-controls">
        <button aria-label="Close" onclick="closeWindow('themesWindow')"></button>
      </div>
    </div>
    <div class="window-body">
      <fieldset>
        <legend>Desktop Background</legend>
        <div id="theme-list">
          <!-- Dynamically populated by JS -->
        </div>
      </fieldset>
    </div>
  </div>

  <!-- Game Player Window (iFrame) -->
  <div class="window" id="gamePlayerWindow" style="left: 150px; top: 80px; width: 640px; height: 480px;">
    <div class="title-bar" id="gamePlayerWindowHeader">
      <div class="title-bar-text" id="gameTitle">Now Playing</div>
      <div class="title-bar-controls">
        <button aria-label="Maximize" onclick="maximizeGame()"></button>
        <button aria-label="Close" onclick="closeWindow('gamePlayerWindow')"></button>
      </div>
    </div>
    <div class="window-body" style="margin:0; padding:0; height: calc(100% - 32px); overflow: hidden;">
      <iframe id="gameFrame" src="" style="width: 100%; height: 100%; border: none; background: #000;"></iframe>
    </div>
  </div>

  <!-- Windows Taskbar -->
  <div class="taskbar">
    <button class="start-btn">
      <img src="https://win98icons.alexmeub.com/icons/png/windows_slanted-1.png" alt="Start">
      Start
    </button>
    <div class="taskbar-clock" id="clock">12:00 PM</div>
  </div>

  <!-- External JavaScript File -->
  <script src="script.js"></script>
</body>
</html>
