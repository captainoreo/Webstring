<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebString - Wii Menu Edition</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="wii-container" id="wiiContainer">
    
    <!-- Wii Menu Header -->
    <div class="wii-top-header">
      <div class="wii-system-title">Wii Menu</div>
      <div class="wii-page-indicator" id="pageIndicator">Page 1 / 8</div>
    </div>

    <!-- Wii Channel Grid Area with Pagination Arrows -->
    <div class="wii-main-area">
      <button class="wii-arrow left-arrow" onclick="changePage(-1)">&#9664;</button>
      
      <div class="wii-channel-grid" id="channelGrid">
        <!-- Dynamically populated by script.js -->
      </div>
      
      <button class="wii-arrow right-arrow" onclick="changePage(1)">&#9654;</button>
    </div>

    <!-- Wii Bottom Bar (Reference IMG_0526) -->
    <div class="wii-bottom-bar">
      <button class="wii-circle-button left-btn" onclick="openThemeModal()" title="Wii Settings & Themes">
        <span>Wii</span>
      </button>
      
      <div class="wii-clock-container">
        <div class="wii-time" id="clock">12:00 AM</div>
        <div class="wii-date" id="dateDisplay">Fri 1/1</div>
      </div>

      <button class="wii-circle-button right-btn" onclick="openThemeModal()" title="Themes & Customization">
        <span class="envelope-icon">✉</span>
      </button>
    </div>

    <!-- Theme / Settings Modal -->
    <div class="wii-modal-overlay" id="themeModal" style="display: none;">
      <div class="wii-modal-window">
        <div class="wii-modal-header">
          <span>Wii Settings - Display Properties</span>
          <button class="wii-pill-btn" onclick="closeThemeModal()">Back</button>
        </div>
        <div class="wii-modal-body">
          <fieldset class="wii-fieldset">
            <legend>Select Theme / Mascot</legend>
            <div id="theme-list"></div>
          </fieldset>
        </div>
      </div>
    </div>

    <!-- Game Player Overlay / Internet Channel (Reference IMG_0529) -->
    <div class="wii-modal-overlay" id="gamePlayerModal" style="display: none;">
      <div class="wii-modal-window player-window">
        <div class="wii-modal-header">
          <span id="gameTitle">Now Playing</span>
          <div class="wii-player-actions">
            <button class="wii-pill-btn" onclick="maximizeGame()">Maximize</button>
            <button class="wii-pill-btn close-action" onclick="closeGame()">Wii Menu</button>
          </div>
        </div>
        <div class="wii-modal-body player-body">
          <iframe id="gameFrame" src=""></iframe>
        </div>
      </div>
    </div>

    <!-- Theme Mascot Integration -->
    <img id="desktop-mascot" class="vocaloid-mascot" src="" alt="Theme Mascot">
  </div>

  <script src="script.js"></script>
</body>
</html>
