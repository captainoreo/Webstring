<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jamespocalypse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .number-font {
            font-family: 'JetBrains Mono', monospace;
        }
        /* Subtle pulse animation for the background */
        @keyframes gradient-shift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .animate-gradient {
            background-size: 200% 200%;
            animation: gradient-shift 15s ease infinite;
        }
    </style>
</head>
<body class="min-h-screen animate-gradient bg-gradient-to-br from-slate-900 via-purple-900 to-indigo-950 text-white flex items-center justify-center p-4">

    <main class="w-full max-w-4xl text-center">
        <!-- Header Section -->
        <div class="mb-12 animate-fade-in-up">
            <h1 class="text-4xl md:text-6xl font-extrabold tracking-tight mb-3 text-transparent bg-clip-text bg-gradient-to-r from-red-400 via-purple-300 to-pink-300 drop-shadow-sm uppercase">
                Jamespocalypse
            </h1>
            <p class="text-lg md:text-xl text-purple-200/70 font-light uppercase tracking-widest">
                October 3, 2026
            </p>
        </div>

        <!-- Countdown Container (Glassmorphism) -->
        <div class="backdrop-blur-xl bg-white/10 border border-white/20 p-8 md:p-12 rounded-3xl shadow-[0_8px_32px_0_rgba(0,0,0,0.37)] flex flex-wrap justify-center gap-6 md:gap-10">
            
            <!-- Days -->
            <div class="flex flex-col items-center min-w-[100px] md:min-w-[140px]">
                <div class="bg-black/20 rounded-2xl p-4 w-full border border-white/10 shadow-inner mb-3">
                    <span id="days" class="number-font text-5xl md:text-7xl font-bold text-white drop-shadow-md">00</span>
                </div>
                <span class="text-sm md:text-base font-semibold uppercase tracking-widest text-purple-200/80">Days</span>
            </div>

            <!-- Hours -->
            <div class="flex flex-col items-center min-w-[100px] md:min-w-[140px]">
                <div class="bg-black/20 rounded-2xl p-4 w-full border border-white/10 shadow-inner mb-3">
                    <span id="hours" class="number-font text-5xl md:text-7xl font-bold text-white drop-shadow-md">00</span>
                </div>
                <span class="text-sm md:text-base font-semibold uppercase tracking-widest text-purple-200/80">Hours</span>
            </div>

            <!-- Minutes -->
            <div class="flex flex-col items-center min-w-[100px] md:min-w-[140px]">
                <div class="bg-black/20 rounded-2xl p-4 w-full border border-white/10 shadow-inner mb-3">
                    <span id="minutes" class="number-font text-5xl md:text-7xl font-bold text-white drop-shadow-md">00</span>
                </div>
                <span class="text-sm md:text-base font-semibold uppercase tracking-widest text-purple-200/80">Minutes</span>
            </div>

            <!-- Seconds -->
            <div class="flex flex-col items-center min-w-[100px] md:min-w-[140px]">
                <div class="bg-black/20 rounded-2xl p-4 w-full border border-white/10 shadow-inner mb-3">
                    <span id="seconds" class="number-font text-5xl md:text-7xl font-bold text-pink-300 drop-shadow-md">00</span>
                </div>
                <span class="text-sm md:text-base font-semibold uppercase tracking-widest text-purple-200/80">Seconds</span>
            </div>

        </div>

        <!-- Message shown when countdown is finished -->
        <div id="completion-message" class="hidden mt-12 backdrop-blur-md bg-red-500/20 border border-red-500/30 p-6 rounded-2xl">
            <h2 class="text-3xl font-bold text-white mb-2">The Jamespocalypse is Here!</h2>
            <p class="text-red-100">Brace yourselves. October 3, 2026 has arrived.</p>
        </div>
    </main>

    <script>
        // Set the target date we're counting down to
        // October 3rd, 2026 at 00:00:00 (Midnight)
        const targetDate = new Date("October 3, 2026 00:00:00").getTime();

        // Get DOM elements for performance
        const daysEl = document.getElementById("days");
        const hoursEl = document.getElementById("hours");
        const minutesEl = document.getElementById("minutes");
        const secondsEl = document.getElementById("seconds");
        const messageEl = document.getElementById("completion-message");

        // Helper function to pad single digit numbers with a leading zero
        function padNumber(num) {
            return num < 10 ? "0" + num : num;
        }

        // Function to update the countdown
        function updateCountdown() {
            // Get today's date and time
            const now = new Date().getTime();

            // Find the distance between now and the count down date
            const distance = targetDate - now;

            // Time calculations for days, hours, minutes and seconds
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            // Output the result in the elements
            daysEl.innerText = padNumber(days);
            hoursEl.innerText = padNumber(hours);
            minutesEl.innerText = padNumber(minutes);
            secondsEl.innerText = padNumber(seconds);

            // If the count down is over, clear the interval and show completion message
            if (distance < 0) {
                clearInterval(countdownInterval);
                daysEl.innerText = "00";
                hoursEl.innerText = "00";
                minutesEl.innerText = "00";
                secondsEl.innerText = "00";
                
                // Show the celebration message
                messageEl.classList.remove("hidden");
                messageEl.classList.add("block");
            }
        }

        // Run the update function immediately to avoid a 1-second delay
        updateCountdown();

        // Update the count down every 1 second
        const countdownInterval = setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
