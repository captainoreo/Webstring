<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Console Menu UI - Paginated with Icons</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Arial', sans-serif; }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #333;
        }

        .screen {
            position: relative;
            width: 800px;
            height: 600px;
            background: #e8e8e8;
            background-image: repeating-linear-gradient(to bottom, transparent, transparent 2px, rgba(0,0,0,0.04) 2px, rgba(0,0,0,0.04) 4px);
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* --- Pagination Arrows --- */
        .arrow {
            position: absolute;
            top: 40%;
            transform: translateY(-50%);
            width: 0; 
            height: 0; 
            border-top: 25px solid transparent;
            border-bottom: 25px solid transparent;
            cursor: pointer;
            z-index: 10;
            transition: transform 0.2s, filter 0.2s;
            filter: drop-shadow(0 0 5px rgba(92, 225, 230, 0.8));
        }

        .arrow:hover { transform: translateY(-50%) scale(1.1); filter: drop-shadow(0 0 10px rgba(92, 225, 230, 1)); }

        .arrow-left {
            left: 10px;
            border-right: 35px solid #5ce1e6;
            display: none;
        }

        .arrow-right {
            right: 10px;
            border-left: 35px solid #5ce1e6;
        }

        /* --- Channel Grid --- */
        .pages-container {
            position: relative;
            width: 100%;
            height: 480px;
        }

        .grid {
            display: none;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 12px;
            padding: 40px 60px;
            height: 100%;
        }

        .grid.active {
            display: grid;
        }

        .channel {
            background: #f0f0f0;
            border-radius: 15px;
            border: 2px solid rgba(0,0,0,0.1);
            box-shadow: inset 0 0 15px rgba(0,0,0,0.1), 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s;
            cursor: pointer;
            text-decoration: none; 
            color: #555;
            font-size: 0.85rem;
            font-weight: bold;
        }

        /* Image styling to fit inside the rounded box */
        .channel img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            border-radius: 13px; /* Keeps it inside the 15px border of the container */
        }

        .channel:hover { 
            transform: scale(1.05); 
            background: #fff;
            color: #000;
        }

        .channel.empty {
            cursor: default;
        }
        
        .channel.empty:hover {
            transform: none;
            background: #f0f0f0;
        }

        /* --- Bottom Bar --- */
        .bottom-bar {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 120px;
            background: linear-gradient(to bottom, #f5f5f5, #d0d0d0);
            pointer-events: none;
        }

        .bottom-bar::before {
            content: '';
            position: absolute;
            top: -30px;
            left: -10%;
            width: 120%;
            height: 60px;
            background: #f5f5f5;
            border-top: 3px solid #5ce1e6;
            border-radius: 50% 50% 0 0;
        }

        .footer-content {
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 0 40px 20px 40px;
            height: 100%;
            pointer-events: auto;
        }

        .round-btn {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #fff, #e0e0e0);
            border-radius: 50%;
            border: 3px solid #5ce1e6;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: #888;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1), inset 0 -3px 5px rgba(0,0,0,0.1);
            position: relative;
            cursor: pointer;
            text-decoration: none;
        }

        .msg-badge {
            position: absolute;
            bottom: -5px;
            right: 20px;
            font-size: 0.8rem;
            color: #888;
        }

        .time-date { text-align: center; color: #666; margin-bottom: 5px; }
        .time { font-family: 'Courier New', monospace; font-size: 2.5rem; letter-spacing: 5px; }
        .am { font-family: 'Arial', sans-serif; font-size: 1.2rem; letter-spacing: 0; }
        .date { font-size: 1.5rem; font-weight: bold; margin-top: -5px; }
    </style>
</head>

    <!-- JavaScript to handle page switching -->
    <script>
        let currentPage = 0;
        const totalPages = 3;

        function changePage(direction) {
            document.getElementById(`page-${currentPage}`).classList.remove('active');
            currentPage += direction;
            document.getElementById(`page-${currentPage}`).classList.add('active');
            
            if (currentPage === 0) {
                document.getElementById('prev-btn').style.display = 'none';
            } else {
                document.getElementById('prev-btn').style.display = 'block';
            }

            if (currentPage === totalPages - 1) {
                document.getElementById('next-btn').style.display = 'none';
            } else {
                document.getElementById('next-btn').style.display = 'block';
            }
        }
    </script>
